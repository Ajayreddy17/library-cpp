name: verify

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip3 install "setuptools<81"
        pip3 install -U online-judge-verify-helper

    - name: Restore downloaded test cases
      uses: actions/cache@v4
      with:
        path: .verify-helper/cache
        key: oj-verify-${{ runner.os }}-${{ hashFiles('test/**/*.test.cpp') }}
        restore-keys: |
          oj-verify-${{ runner.os }}-

    - name: Run verification
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: oj-verify all

    - name: Commit verification timestamps
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "GitHub Actions"
        git config user.email "noreply@github.com"
        git add .verify-helper/timestamps.remote.json
        if git diff --cached --quiet; then
          echo "timestamps unchanged"
        else
          git commit -m "[auto-verifier] update timestamps"
          git push
        fi
